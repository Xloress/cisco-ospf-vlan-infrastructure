R-Core-3 (Azlan)
enable
configure terminal
hostname R-CORE-3
enable secret admin
username admin privilege 15 secret admin
ip domain name telmat.net
!
interface Loopback0
ip address 192.168.0.3 255.255.255.255
no shutdown
!
interface Ethernet0/0
ip address 192.168.113.2 255.255.255.252
no shutdown
!
interface Ethernet0/1
ip address 192.168.33.1 255.255.255.252
no shutdown
!
interface Ethernet0/2
ip address 192.168.34.1 255.255.255.252
no shutdown
!
router ospf 123
router-id 192.168.0.3
network 192.168.0.3 0.0.0.0 area 0
network 192.168.113.0 0.0.0.3 area 0
network 192.168.33.0 0.0.0.3 area 1
network 192.168.34.0 0.0.0.3 area 2
!
line con 0
logging synchronous

line vty 0 4
login local
transport input ssh
!
end
write memory
