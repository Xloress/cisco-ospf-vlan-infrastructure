F.​ SW-IT-1 (Keysa)
enable
configure terminal
hostname SW-IT-1
ip routing
enable secret admin
username admin privilege 15 secret admin
ip domain-name telmat.net
!
interface Loopback0
no shutdown
ip address 192.168.0.11 255.255.255.255
!
interface Ethernet0/0
no shutdown
no switchport
ip address 192.168.21.2 255.255.255.252
!
interface Ethernet1/0
no shutdown
switchport access vlan 11
switchport mode access
spanning-tree portfast edge
!
interface Ethernet1/2
no shutdown
switchport access vlan 11
switchport mode access
spanning-tree