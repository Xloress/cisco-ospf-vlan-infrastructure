SW-HRD (Azlan)

enable
configure terminal
hostname SW-HRD
ip routing
enable secret admin
username admin privilege 15 secret admin
ip domain-name telmat.net
!
interface Loopback0
no shutdown
ip address 192.168.0.13 255.255.255.255
!
interface Ethernet0/0
no shutdown
no switchport
ip address 192.168.33.2 255.255.255.252
!
interface Ethernet1/0
no shutdown
switchport access vlan 13
switchport mode access
spanning-tree portfast edge
!
interface Ethernet1/2
no shutdown
switchport access vlan 13
switchport mode access
spanning-tree portfast edge
!
interface Vlan13
no shutdown
ip address 192.168.13.1 255.255.255.0
!
router ospf 123
router-id 192.168.0.13
network 192.168.0.13 0.0.0.0 area 1
network 192.168.13.0 0.0.0.255 area 1
network 192.168.33.0 0.0.0.3 area 1
!
ip ssh version 2
line con 0
logging synchronous
line vty 0 4
login local
transport input ssh
!
end
write memory

